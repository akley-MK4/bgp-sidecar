# Network setup for BGP gateway simulation — VLAN device + Multus NAD
#
# Apply once, before the sim-gw-a / sim-gw-b Deployments:
#   kubectl apply -f network.yaml
#
# Both gateway pods attach this network via the pod annotation:
#   k8s.v1.cni.cncf.io/networks: macvlan-enp4s0-2002
#
# macvlan in bridge mode attaches the pods to the VLAN device's L2 network, so
# the two gateway pods can reach each other directly on 11.0.3.0/24. No IPAM is
# configured: the pod's init container (init-net) brings net1 up and assigns the
# static data-plane address (11.0.3.50 on sim-gw-a, 11.0.3.60 on sim-gw-b).
#
# Requirements / notes:
# - Multus must be installed, together with a default pod CNI (the pod's primary
#   eth0 still uses the default CNI, but is not used for the BGP data plane).
# - The VLAN device "vlan-enp4s0-2002" is created by NodeNetworkConfigurationPolicy
#   on the target node(s).
# - macvlan bridge mode is L2-local on a single node: the sim-gw-a and
#   sim-gw-b Deployments enforce same-node scheduling via mutual podAffinity.
#   For cross-node data-plane connectivity, ensure the VLAN is routed or use
#   an overlay instead.
---
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: vlan-enp4s0-2002
spec:
  nodeSelector:
    kubernetes.io/hostname: agf
  desiredState:
    interfaces:
    - name: enp4s0.2002
      type: vlan
      state: up
      vlan:
        base-iface: enp4s0
        id: 2002
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-enp4s0-2002
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "enp4s0.2002",
      "mode": "bridge"
    }