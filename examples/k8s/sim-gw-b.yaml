# Verification (run after BGP establishes):
#   kubectl exec deploy/sim-gw-b -c svc -- ping -I 33.0.3.60 22.0.3.50
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sim-gw-b-config
data:
  daemons: |
    zebra=yes
    bgpd=yes
    ospfd=no
    ospf6d=no
    isisd=no
    ripd=no
    ripngd=no
    pimd=no
    ldpd=no
    nhrpd=no
    bfdd=yes
    staticd=no
    vrrpd=no
    sharpd=no
    pbrd=no
    fabricd=no
    vtysh_enable=yes
  frr.conf: |
    ! /etc/frr/frr.conf
    !
    ! Simulated BGP gateway "sim-gw-b"
    !
    hostname sim-gw-b
    service integrated-vtysh-config
    !
    ! Interfaces are created by the init container (init-net):
    !   net1   = 11.0.3.60/24 (data plane)
    !   lo:src = 33.0.3.60/24 (business logic, advertised via BGP)
    !
    route-map RM-ALLOW-PEER permit 10
    !
    router bgp 65002
     bgp router-id 11.0.3.60
     neighbor 11.0.3.50 remote-as 65001
     neighbor 11.0.3.50 route-map RM-ALLOW-PEER in
     neighbor 11.0.3.50 route-map RM-ALLOW-PEER out
     !
     address-family ipv4 unicast
      neighbor 11.0.3.50 activate
      network 33.0.3.0/24
     exit-address-family
    !
    line vty
    !
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-gw-b
  labels:
    app: sim-gw-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sim-gw-b
  template:
    metadata:
      labels:
        app: sim-gw-b
      annotations:
        k8s.v1.cni.cncf.io/networks: macvlan-enp4s0-2002
    spec:
      # macvlan bridge mode is L2-local: both gateway pods must land on the
      # same node to reach each other directly on 11.0.3.0/24.
      nodeSelector:
        kubernetes.io/hostname: agf
      initContainers:
        # Creates the pod's network interfaces before FRR starts:
        # - brings up net1 (attached by Multus as a raw macvlan, no IPAM)
        #   and assigns its static data-plane address
        # - creates the lo:src service loopback as a labeled alias on lo
        - name: init-net
          image: svc:v1.0.0-beta.1
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          command:
            - /bin/sh
            - -c
            - |
              ip link set lo up
              ip link set net1 up
              ip addr add 11.0.3.60/24 dev net1
              ip addr add 33.0.3.60/24 dev lo label lo:src
      containers:
        # Main application container; periodically pings the peer's lo:src
        # address through its own lo:src to verify BGP-routed connectivity.
        - name: svc
          image: svc:v1.0.0-beta.1
          command:
            - /bin/sh
            - -c
            - |
              prev_fail=0
              while true; do
                if ping -I 33.0.3.60 -c 1 -W 2 22.0.3.50 >/dev/null 2>&1; then
                  if [ "$prev_fail" -eq 1 ]; then
                    echo "$(date): ping from 22.0.3.50 to 33.0.3.60 succeeded"
                    prev_fail=0
                  fi
                else
                  echo "$(date): ping from 22.0.3.50 to 33.0.3.60 failed"
                  prev_fail=1
                fi
                sleep 10
              done
          imagePullPolicy: IfNotPresent
        # BGP sidecar built from this repository's Dockerfile.
        - name: bgp
          image: bgp:v1.0.0-beta.1
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - NET_BIND_SERVICE
                - SYS_ADMIN
          env:
            - name: FRR_CONF_DIR
              value: /etc/frr
          ports:
            - name: bgp
              containerPort: 179
              protocol: TCP
          volumeMounts:
            - name: frr-config
              mountPath: /etc/frr
              readOnly: false
      volumes:
        - name: frr-config
          configMap:
            name: sim-gw-b-config