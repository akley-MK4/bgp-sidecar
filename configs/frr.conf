! /etc/frr/frr.conf
!
! FRR configuration template for a Kubernetes BGP sidecar
!
hostname bgp-sidecar
service integrated-vtysh-config
!
interface lo
 ip address 127.0.0.1/8
!
router bgp 65001
 bgp router-id 10.0.0.10
 neighbor 10.0.0.2 remote-as 65002
 ! neighbor 10.0.0.2 description uplink-peer
 ! address-family ipv4 unicast
 network 10.0.0.0/24
 exit-address-family
!
line vty
!
